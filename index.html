<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catat Nota Spare Part AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-xl { padding: 20px; font-size: 1.2rem; font-weight: bold; }
        input, td input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 100%; }
        .loading { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">📝 Catat Nota Spare Part</h1>

        <!-- Step 1: Upload -->
        <div id="upload-section" class="space-y-4">
            <label class="block bg-blue-500 text-white text-center rounded-xl btn-xl cursor-pointer hover:bg-blue-600 transition">
                📸 AMBIL FOTO / UPLOAD NOTA
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processImage()">
            </label>
            <p class="text-gray-500 text-sm text-center">Pastikan tulisan di nota terlihat jelas</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading text-center my-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
            <p class="mt-4 text-blue-600 font-semibold">AI sedang membaca nota...</p>
        </div>

        <!-- Step 2: Preview & Edit -->
        <div id="preview-section" class="hidden mt-6">
            <h2 class="font-bold text-lg mb-2">Cek Data Nota:</h2>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="text-xs text-gray-500">Tanggal</label>
                    <input type="text" id="res-tanggal">
                </div>
                <div>
                    <label class="text-xs text-gray-500">Nama Sales/Supplier</label>
                    <input type="text" id="res-supplier">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm mb-4">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-2 text-left">Barang</th>
                            <th class="p-2 w-16 text-center">Qty</th>
                            <th class="p-2 text-right">Harga</th>
                        </tr>
                    </thead>
                    <tbody id="items-table">
                        <!-- Data barang akan masuk di sini -->
                    </tbody>
                </table>
            </div>

            <button onclick="saveToSheets()" class="w-full bg-green-500 text-white btn-xl rounded-xl hover:bg-green-600">
                ✅ SIMPAN KE DATABASE
            </button>
            <button onclick="resetForm()" class="w-full mt-3 text-gray-500 font-semibold">Batal</button>
        </div>

        <!-- Settings -->
        <div class="mt-10 border-t pt-4">
            <details>
                <summary class="text-xs text-gray-400 cursor-pointer">Pengaturan Aplikasi</summary>
                <div class="p-2 space-y-2">
                    <input type="password" id="geminiKey" placeholder="Gemini API Key">
                    <input type="text" id="webhookUrl" placeholder="Google Script URL">
                </div>
            </details>
        </div>
    </div>

    <script>
        let extractedData = null;

        async function processImage() {
            const fileInput = document.getElementById('imageInput');
            const apiKey = document.getElementById('geminiKey').value;
            
            if (!apiKey) { alert('Masukkan API Key Gemini dulu di pengaturan bawah!'); return; }
            if (!fileInput.files[0]) return;

            // UI Switch
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('loading').style.display = 'block';

            const file = fileInput.files[0];
            const base64Data = await toBase64(file);
            const base64Content = base64Data.split(',')[1];

            const prompt = `Ekstrak data dari nota ini ke format JSON. 
                Cari: tanggal (YYYY-MM-DD), supplier (nama sales/toko), 
                dan daftar items (nama, qty, harga per unit). 
                Format JSON saja: {"tanggal": "...", "supplier": "...", "items": [{"nama": "...", "qty": 1, "harga": 5000}]}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64Content } }] }]
                    })
                });

                const result = await response.json();
                const textResponse = result.candidates[0].content.parts[0].text;
                // Bersihkan teks dari markdown json jika ada
                const cleanJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                extractedData = JSON.parse(cleanJson);

                showPreview(extractedData);
            } catch (error) {
                alert("Gagal membaca nota. Pastikan API Key benar dan gambar jelas.");
                resetForm();
            }
        }

        function showPreview(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('preview-section').classList.remove('hidden');
            
            document.getElementById('res-tanggal').value = data.tanggal;
            document.getElementById('res-supplier').value = data.supplier;

            const tableBody = document.getElementById('items-table');
            tableBody.innerHTML = '';
            
            data.items.forEach((item, index) => {
                const row = `<tr>
                    <td class="py-1"><input type="text" value="${item.nama}" onchange="updateItem(${index}, 'nama', this.value)"></td>
                    <td class="py-1"><input type="number" value="${item.qty}" class="text-center" onchange="updateItem(${index}, 'qty', this.value)"></td>
                    <td class="py-1"><input type="number" value="${item.harga}" class="text-right" onchange="updateItem(${index}, 'harga', this.value)"></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        function updateItem(index, field, value) {
            extractedData.items[index][field] = value;
        }

        async function saveToSheets() {
            const webhook = document.getElementById('webhookUrl').value;
            if (!webhook) { alert('Masukkan URL Google Script di pengaturan!'); return; }

            // Final data update from main fields
            extractedData.tanggal = document.getElementById('res-tanggal').value;
            extractedData.supplier = document.getElementById('res-supplier').value;

            try {
                await fetch(webhook, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(extractedData)
                });
                alert('Data BERHASIL disimpan ke Google Sheets!');
                resetForm();
            } catch (e) {
                alert('Gagal mengirim data.');
            }
        }

        function resetForm() {
            location.reload();
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
